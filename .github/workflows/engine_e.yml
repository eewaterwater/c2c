name: C2C Engine E (Equities & US DR Scanner)

on:
  schedule:
    # 13:00 UTC = 20:00 Bangkok Time (Mon-Fri pre-US cash open)
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  scan-equities:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests yfinance pandas numpy pytz

      - name: Run Macro Classifier & High-Velocity DR Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import os
          import requests
          from datetime import datetime
          import pytz
          import yfinance as yf
          import pandas as pd
          import numpy as np

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          bkk_time = datetime.now(pytz.timezone("Asia/Bangkok")).strftime("%Y-%m-%d %H:%M:%S")

          def safe_series(df):
              if df is None or df.empty:
                  return np.array([])
              if isinstance(df.columns, pd.MultiIndex):
                  return df["Close"].iloc[:, 0].dropna().values
              return df["Close"].dropna().values

          # ------------------------------------------------------------------
          # 1. Fetch USD/THB Exchange Rate
          # ------------------------------------------------------------------
          usd_thb = 35.0
          try:
              thb_df = yf.download("THB=X", period="5d", interval="1d", progress=False)
              c_thb = safe_series(thb_df)
              if len(c_thb) > 0:
                  usd_thb = float(c_thb[-1])
          except Exception as e:
              print(f"FX Error: {e}")

          # ------------------------------------------------------------------
          # 2. Macro Regime Classifier (Daily QQQ)
          # ------------------------------------------------------------------
          regime_name = "Regime 3: Rangebound Chop"
          regime_icon = "🟡"
          r_thb = 15000.0
          r_label = "0.50R (฿15,000 THB)"
          vault_a_alloc = "35% QQQ / 25% SMH / 40% SGOV"
          risk_authorized = True
          qqq_3d_ret = 0.0

          try:
              qqq_df = yf.download("QQQ", period="1y", interval="1d", progress=False)
              c_qqq = safe_series(qqq_df)
              if len(c_qqq) >= 200:
                  p_now = float(c_qqq[-1])
                  p_ema20 = float(pd.Series(c_qqq).ewm(span=20, adjust=False).mean().iloc[-1])
                  p_ema50 = float(pd.Series(c_qqq).ewm(span=50, adjust=False).mean().iloc[-1])
                  p_sma200 = float(pd.Series(c_qqq).rolling(200).mean().iloc[-1])

                  if len(c_qqq) >= 4:
                      qqq_3d_ret = ((p_now - c_qqq[-4]) / c_qqq[-4]) * 100.0

                  if p_now < p_sma200 * 0.985:
                      regime_name = "Regime 4: Structural Bear"
                      regime_icon = "🔴"
                      r_thb = 0.0
                      r_label = "0.0R (100% Cash Gate)"
                      vault_a_alloc = "100% SGOV (0% Equities)"
                      risk_authorized = False
                  elif p_now > p_ema20 > p_ema50 > p_sma200:
                      regime_name = "Regime 1: Confirmed Bull"
                      regime_icon = "🟢"
                      r_thb = 30000.0
                      r_label = "1.0R (฿30,000 THB)"
                      vault_a_alloc = "55% QQQ / 35% SMH / 10% SGOV"
                  elif p_now < p_ema20 and p_now > p_sma200:
                      regime_name = "Regime 2: Bull Pullback"
                      regime_icon = "🟠"
                      r_thb = 22500.0
                      r_label = "0.75R (฿22,500 THB)"
                      vault_a_alloc = "35% QQQ / 25% SMH / 40% SGOV"
                  else:
                      regime_name = "Regime 3: Rangebound Chop"
                      regime_icon = "🟡"
                      r_thb = 15000.0
                      r_label = "0.50R (฿15,000 THB)"
                      vault_a_alloc = "35% QQQ / 25% SMH / 40% SGOV"
          except Exception as e:
              print(f"Macro error: {e}")

          # ------------------------------------------------------------------
          # 3. Watchpool DR Details & Conversion Ratios (SET Official)
          # ------------------------------------------------------------------
          watchpool = [
              {"ticker": "NVDA", "dr": "NVDA80X", "ratio": 200},
              {"ticker": "PLTR", "dr": "PLTR01",  "ratio": 1100},
              {"ticker": "TSLA", "dr": "TSLA80X", "ratio": 5000},
              {"ticker": "AMD",  "dr": "AMD80X",  "ratio": 5000},
              {"ticker": "SOXX", "dr": "SOXX23",  "ratio": 100}
          ]

          candidates = []
          summary_lines = []

          for item in watchpool:
              sym = item["ticker"]
              dr_sym = item["dr"]
              ratio = item["ratio"]
              try:
                  t_obj = yf.Ticker(sym)
                  hist = t_obj.history(period="3mo", interval="1d")
                  if len(hist) < 30:
                      continue

                  c = hist["Close"].dropna().values
                  curr_p = float(c[-1])
                  ema21 = float(pd.Series(c).ewm(span=21, adjust=False).mean().iloc[-1])

                  # 3-Day RS vs QQQ
                  p_3d = float(c[-4]) if len(c) >= 4 else curr_p
                  stock_ret = ((curr_p - p_3d) / p_3d) * 100.0
                  rs_delta = stock_ret - qqq_3d_ret

                  # Bollinger Band Width Compression (20, 2)
                  s_c = pd.Series(c)
                  sma20 = s_c.rolling(20).mean()
                  std20 = s_c.rolling(20).std()
                  bbw = ((sma20 + 2*std20) - (sma20 - 2*std20)) / sma20 * 100.0
                  is_compressed = bool(bbw.iloc[-1] <= bbw.tail(60).quantile(0.25))

                  # 72-Hour Earnings Blackout Gate
                  imminent_earn = False
                  try:
                      cal = t_obj.calendar
                      if cal is not None and not (isinstance(cal, pd.DataFrame) and cal.empty):
                          dt = None
                          if isinstance(cal, pd.DataFrame) and "Earnings Date" in cal.index:
                              dt = pd.to_datetime(cal.loc["Earnings Date"].iloc[0])
                          elif isinstance(cal, dict) and "Earnings Date" in cal:
                              dt = pd.to_datetime(cal["Earnings Date"][0])
                          if dt:
                              dt_naive = dt.tz_localize(None) if dt.tzinfo else dt
                              if 0 <= (dt_naive - datetime.now()).days <= 3:
                                  imminent_earn = True
                  except Exception:
                      pass

                  dist_21 = ((curr_p - ema21) / ema21) * 100.0
                  comp_tag = "📦 Squeeze" if is_compressed else "Normal"

                  summary_lines.append(
                      f"• <b>{dr_sym}</b> (${curr_p:.2f}): RS {rs_delta:+.1f}% | 21EMA {dist_21:+.1f}% | {comp_tag}"
                  )

                  if (curr_p >= ema21 * 0.99) and (not imminent_earn) and (rs_delta > 0) and risk_authorized:
                      candidates.append({
                          "dr": dr_sym,
                          "ticker": sym,
                          "usd_price": curr_p,
                          "ratio": ratio,
                          "rs": rs_delta,
                          "stop_usd": curr_p * 0.975
                      })
              except Exception as e:
                  print(f"Error {sym}: {e}")

          candidates.sort(key=lambda x: x["rs"], reverse=True)
          top_picks = candidates[:2]

          # ------------------------------------------------------------------
          # 4. THB Conversion, Unit Calculation & Settrade Staging
          # ------------------------------------------------------------------
          ticket_blocks = []
          settrade_copy_blocks = []

          if top_picks and risk_authorized and r_thb > 0:
              ticket_blocks.append("📋 <b>STAGED HIGH-VELOCITY TICKETS (THB Sized):</b>")
              for p in top_picks:
                  entry_usd = p["usd_price"]
                  stop_usd = p["stop_usd"]
                  ratio = p["ratio"]

                  # Convert to THB per DR unit
                  entry_thb = (entry_usd * usd_thb) / ratio
                  stop_thb = (stop_usd * usd_thb) / ratio
                  risk_per_unit = entry_thb - stop_thb

                  if risk_per_unit <= 0.001:
                      continue

                  # Position Sizing
                  raw_units = int(r_thb / risk_per_unit)
                  raw_outlay = raw_units * entry_thb

                  # 20% Vault B Cap (฿600,000 THB)
                  max_cap = 600000.0
                  if raw_outlay > max_cap:
                      units = int(max_cap / entry_thb)
                      capped_tag = " <i>(Capped at 20% Vault B)</i>"
                  else:
                      units = raw_units
                      capped_tag = ""

                  # Tranche Targets in THB
                  target1_thb = entry_thb + (1.5 * risk_per_unit)
                  target2_thb = entry_thb + (3.0 * risk_per_unit)
                  t1_units = int(units * 0.60)
                  t2_units = units - t1_units

                  ticket_blocks.extend([
                      f"🎯 <b>{p['dr']} ({p['ticker']}) Setup:</b>",
                      f"  • Entry: <b>฿{entry_thb:.2f}</b> (${entry_usd:.2f})",
                      f"  • Hard Stop: <b>฿{stop_thb:.2f}</b> (-2.5%)",
                      f"  • Sizing: <b>{units:,} units</b> (Outlay: ฿{units*entry_thb:,.0f} THB){capped_tag}",
                      f"  • <b>T1 (Bank 60% / {t1_units:,} u):</b> Limit <b>฿{target1_thb:.2f}</b> (+1.5R &gt;&gt; Stop to BE)",
                      f"  • <b>T2 (Runner 40% / {t2_units:,} u):</b> Limit <b>฿{target2_thb:.2f}</b> (+3.0R)",
                      ""
                  ])

                  # Formatted copy-paste block for Settrade Streaming
                  settrade_copy_blocks.append(
                      f"<code>BUY {p['dr']} @ ฿{entry_thb:.2f} | Vol: {units:,} | Stop: ฿{stop_thb:.2f}</code>"
                  )
          else:
              ticket_blocks.append("📋 <b>EXECUTION:</b> Zero breakout setups qualified. Retain cash in MMF.")

          # ------------------------------------------------------------------
          # 5. Build and Send Telegram Message
          # ------------------------------------------------------------------
          lines = [
              "🇺🇸 <b>[C2C Engine E - Dual-Vault Briefing]</b>",
              f"📅 <b>Time:</b> {bkk_time} BKK",
              f"💵 <b>USD/THB:</b> ฿{usd_thb:.2f}",
              "━━━━━━━━━━━━━━━━━━",
              f"📊 <b>MACRO REGIME:</b> {regime_icon} <b>{regime_name}</b>",
              f"• <b>Risk Budget:</b> <b>{r_label}</b>",
              f"• <b>Vault A Target:</b> <code>{vault_a_alloc}</code>",
              "━━━━━━━━━━━━━━━━━━",
              "🔍 <b>WATCHPOOL METRICS:</b>",
              "\n".join(summary_lines) if summary_lines else "• Data pending",
              "━━━━━━━━━━━━━━━━━━"
          ]
          lines.extend(ticket_blocks)

          if settrade_copy_blocks:
              lines.append("━━━━━━━━━━━━━━━━━━\n📲 <b>SETTRADE QUICK-PASTE:</b>")
              lines.extend(settrade_copy_blocks)

          lines.append("━━━━━━━━━━━━━━━━━━\n<i>Automated pipeline running via GitHub Cloud.</i>")
          full_msg = "\n".join(lines)

          if token and chat_id:
              url = f"https://api.telegram.org/bot{token}/sendMessage"
              res = requests.post(url, json={"chat_id": chat_id, "text": full_msg, "parse_mode": "HTML"}, timeout=15)
              print(f"Telegram status: {res.status_code}")
          else:
              print("Missing Telegram credentials.")
          EOF
