name: C2C Engine E (Equities & US DR Scanner)

on:
  schedule:
    - cron: '45 12 * * 1-5'   # 19:45 BKK - Evening Pre-Market Prep Scan
    - cron: '15 13 * * 1-5'   # 20:15 BKK - Market Open Alignment Scan
    - cron: '30 20 * * 1-5'   # 03:30 BKK - US Cash Close Audit
  workflow_dispatch:
    inputs:
      trade_outcome:
        description: 'Trade Outcome (none, win, stopout, reset)'
        required: false
        default: 'none'

permissions:
  contents: write

jobs:
  scan-and-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy requests pytz exchange_calendars

      - name: Run Engine E Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OUTCOME: ${{ github.event.inputs.trade_outcome }}
        run: python engine_e.py

      - name: Auto-Commit Persistent State
        run: |
          git config --global user.name "C2C State Engine"
          git config --global user.email "bot@code2cash.internal"
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: persist engine_e state [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
