name: C2C Engine E (Equities & US DR Scanner)

on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      trade_outcome:
        description: 'Update trade outcome (win / stopout / reset / none)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - win
          - stopout
          - reset

jobs:
  scan-equities:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests yfinance pandas numpy pytz exchange_calendars

      - name: Run Engine E Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OUTCOME: ${{ github.event.inputs.trade_outcome }}
        run: python engine_e.py

      - name: Commit Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(state): update trade engine state [skip ci]" && git push origin HEAD:main) || true
