name: C2C Engine E (Equities & US DR Scanner)

on:
  schedule:
    # 13:00 UTC = 20:00 Bangkok Time (Mon-Fri pre-US cash open)
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from Actions tab

jobs:
  scan-equities:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests yfinance pandas numpy pytz

      - name: Run Macro Classifier & High-Velocity DR Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import os
          import requests
          from datetime import datetime, timedelta
          import pytz
          import yfinance as yf
          import pandas as pd
          import numpy as np

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          bkk_time = datetime.now(pytz.timezone("Asia/Bangkok")).strftime("%Y-%m-%d %H:%M:%S")

          # ------------------------------------------------------------------
          # 1. Macro Regime Classifier (Daily QQQ)
          # ------------------------------------------------------------------
          regime_name = "Regime 3: Rangebound Chop"
          regime_icon = "🟡"
          r_thb = 15000.0  # Default 0.5R
          r_label = "0.50R (฿15,000 THB)"
          vault_a_alloc = "35% QQQ / 25% SMH / 40% SGOV"
          risk_authorized = True

          try:
              qqq_df = yf.download("QQQ", period="1y", interval="1d", progress=False)
              if len(qqq_df) >= 200:
                  close = qqq_df["Close"].squeeze()
                  ema20 = close.ewm(span=20, adjust=False).mean()
                  ema50 = close.ewm(span=50, adjust=False).mean()
                  sma200 = close.rolling(window=200).mean()

                  p_now = float(close.iloc[-1])
                  p_ema20 = float(ema20.iloc[-1])
                  p_ema50 = float(ema50.iloc[-1])
                  p_sma200 = float(sma200.iloc[-1])

                  # QQQ 3-day return for Relative Strength benchmark
                  qqq_3d_ret = ((p_now - float(close.iloc[-4])) / float(close.iloc[-4])) * 100.0 if len(close) >= 4 else 0.0

                  if p_now < p_sma200 * 0.985:
                      regime_name = "Regime 4: Structural Bear"
                      regime_icon = "🔴"
                      r_thb = 0.0
                      r_label = "0.0R (100% Cash Gate)"
                      vault_a_alloc = "100% SGOV (0% Equities)"
                      risk_authorized = False
                  elif p_now > p_ema20 > p_ema50 > p_sma200:
                      regime_name = "Regime 1: Confirmed Bull"
                      regime_icon = "🟢"
                      r_thb = 30000.0
                      r_label = "1.0R (฿30,000 THB)"
                      vault_a_alloc = "55% QQQ / 35% SMH / 10% SGOV"
                  elif p_now < p_ema20 and p_now > p_sma200:
                      regime_name = "Regime 2: Bull Pullback"
                      regime_icon = "🟠"
                      r_thb = 22500.0
                      r_label = "0.75R (฿22,500 THB)"
                      vault_a_alloc = "35% QQQ / 25% SMH / 40% SGOV"
                  else:
                      regime_name = "Regime 3: Rangebound Chop"
                      regime_icon = "🟡"
                      r_thb = 15000.0
                      r_label = "0.50R (฿15,000 THB)"
                      vault_a_alloc = "35% QQQ / 25% SMH / 40% SGOV"
          except Exception as e:
              print(f"Macro regime error: {e}")
              qqq_3d_ret = 0.0

          # ------------------------------------------------------------------
          # 2. Watchpool & High-Velocity Metrics
          # ------------------------------------------------------------------
          watchpool = [
              {"ticker": "NVDA", "dr": "NVDA80X"},
              {"ticker": "PLTR", "dr": "PLTR01"},
              {"ticker": "TSLA", "dr": "TSLA80X"},
              {"ticker": "AMD",  "dr": "AMD80X"},
              {"ticker": "SOXX", "dr": "SOXX23"}
          ]

          candidates = []
          summary_lines = []

          for item in watchpool:
              sym = item["ticker"]
              dr_sym = item["dr"]
              try:
                  t_obj = yf.Ticker(sym)
                  hist = t_obj.history(period="3mo", interval="1d")
                  if len(hist) < 30:
                      continue

                  c = hist["Close"]
                  curr_p = float(c.iloc[-1])
                  ema21 = float(c.ewm(span=21, adjust=False).mean().iloc[-1])

                  # Relative Strength vs QQQ (3-Day Delta)
                  p_3d_ago = float(c.iloc[-4]) if len(c) >= 4 else curr_p
                  stock_3d_ret = ((curr_p - p_3d_ago) / p_3d_ago) * 100.0
                  rs_delta = stock_3d_ret - qqq_3d_ret

                  # Bollinger Band Width Compression (20-day, 2 std)
                  sma20 = c.rolling(20).mean()
                  std20 = c.rolling(20).std()
                  bbw_series = ((sma20 + 2 * std20) - (sma20 - 2 * std20)) / sma20 * 100.0
                  curr_bbw = float(bbw_series.iloc[-1])
                  bbw_p25 = float(bbw_series.tail(60).quantile(0.25))
                  is_compressed = curr_bbw <= bbw_p25

                  # 72-Hour Earnings Blackout Gate
                  has_imminent_earnings = False
                  try:
                      cal = t_obj.calendar
                      if cal is not None and not (isinstance(cal, pd.DataFrame) and cal.empty):
                          earn_date = None
                          if isinstance(cal, pd.DataFrame) and "Earnings Date" in cal.index:
                              earn_date = pd.to_datetime(cal.loc["Earnings Date"].iloc[0])
                          elif isinstance(cal, dict) and "Earnings Date" in cal:
                              earn_date = pd.to_datetime(cal["Earnings Date"][0])
                          
                          if earn_date:
                              earn_date_naive = earn_date.tz_localize(None) if earn_date.tzinfo else earn_date
                              days_to_earn = (earn_date_naive - datetime.now()).days
                              if 0 <= days_to_earn <= 3:
                                  has_imminent_earnings = True
                  except Exception:
                      pass

                  dist_21 = ((curr_p - ema21) / ema21) * 100.0

                  # Status tags
                  comp_tag = "📦 Squeeze" if is_compressed else "Normal"
                  earn_tag = "⚠️ EARNINGS <72H" if has_imminent_earnings else "Clear"

                  summary_lines.append(
                      f"• <b>{dr_sym}</b> (${curr_p:.2f}): RS vs QQQ <b>{rs_delta:+.1f}%</b> | 21EMA {dist_21:+.1f}% | {comp_tag}"
                  )

                  # Setup qualification: Above 21 EMA, no earnings, RS positive, compressed or near EMA
                  if (curr_p >= ema21 * 0.99) and (not has_imminent_earnings) and (rs_delta > 0) and risk_authorized:
                      candidates.append({
                          "dr": dr_sym,
                          "ticker": sym,
                          "price": curr_p,
                          "rs": rs_delta,
                          "stop": curr_p * 0.975,  # 2.5% structural pivot stop proxy
                          "compressed": is_compressed
                      })
              except Exception as e:
                  print(f"Error scanning {sym}: {e}")

          # Sort by Relative Strength
          candidates.sort(key=lambda x: x["rs"], reverse=True)
          top_picks = candidates[:2]

          # ------------------------------------------------------------------
          # 3. Build Actionable Settrade Order Tickets
          # ------------------------------------------------------------------
          ticket_blocks = []
          if top_picks and risk_authorized and r_thb > 0:
              ticket_blocks.append("📋 <b>STAGED HIGH-VELOCITY TICKETS (Vault B):</b>")
              for p in top_picks:
                  entry_px = p["price"]
                  stop_px = p["stop"]
                  risk_per_share = entry_px - stop_px
                  target_1 = entry_px + (1.5 * risk_per_share)
                  target_2 = entry_px + (3.0 * risk_per_share)

                  ticket_blocks.extend([
                      f"🎯 <b>{p['dr']} ({p['ticker']}) Setup:</b>",
                      f"  • Trigger Entry: <b>${entry_px:.2f}</b>",
                      f"  • Hard Stop: <b>${stop_px:.2f}</b> (Risk: -2.5%)",
                      f"  • <b>Tranche 1 (Bank 60%):</b> Limit <b>${target_1:.2f}</b> (+1.5R $\\rightarrow$ Move stop to BE)",
                      f"  • <b>Tranche 2 (Runner 40%):</b> Limit <b>${target_2:.2f}</b> (+3.0R or trail 1H EMA9)",
                      f"  • <b>Rules:</b> 72h max hold | Max position cap: ฿600k THB",
                      ""
                  ])
          else:
              ticket_blocks.append("📋 <b>EXECUTION:</b> No active breakout triggers. Retain cash in MMF.")

          # ------------------------------------------------------------------
          # 4. Dispatch Telegram Notification
          # ------------------------------------------------------------------
          lines = [
              "🇺🇸 <b>[C2C Engine E - High-Velocity Scanner]</b>",
              f"📅 <b>Time:</b> {bkk_time} BKK",
              "━━━━━━━━━━━━━━━━━━",
              f"📊 <b>MACRO REGIME:</b> {regime_icon} <b>{regime_name}</b>",
              f"• <b>Risk Unit Budget:</b> <b>{r_label}</b>",
              f"• <b>Vault A Target:</b> <code>{vault_a_alloc}</code>",
              "━━━━━━━━━━━━━━━━━━",
              "🔍 <b>WATCHPOOL METRICS:</b>",
              "\n".join(summary_lines) if summary_lines else "• Data pending",
              "━━━━━━━━━━━━━━━━━━"
          ]
          lines.extend(ticket_blocks)
          lines.append("<i>Automated pipeline running via GitHub Cloud.</i>")

          msg = "\n".join(lines)

          if token and chat_id:
              url = f"https://api.telegram.org/bot{token}/sendMessage"
              res = requests.post(url, json={"chat_id": chat_id, "text": msg, "parse_mode": "HTML"}, timeout=15)
              print(f"Telegram status: {res.status_code}")
          else:
              print("Missing Telegram credentials.")
          EOF
