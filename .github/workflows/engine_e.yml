name: C2C Engine E (US Equities & DR Scanner)

on:
  schedule:
    - cron: '45 12 * * 1-5'   # 19:45 BKK Pre-Market Prep
    - cron: '15 13 * * 1-5'   # 20:15 BKK Market Open Alignment
    - cron: '30 20 * * 1-5'   # 03:30 BKK US Close Audit
  workflow_dispatch:
    inputs:
      outcome:
        description: 'Trade Outcome to Record (win, stopout, reset, none)'
        required: false
        default: 'none'

permissions:
  contents: write

jobs:
  scan-and-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy requests pytz exchange_calendars

      - name: Run Engine E Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OUTCOME: ${{ github.event.inputs.outcome || 'none' }}
        run: python engine_e.py

      - name: Auto-Commit Persistent State
        run: |
          git config --global user.name "C2C State Engine"
          git config --global user.email "bot@code2cash.internal"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: persist engine_e state [skip ci]" && git push)
