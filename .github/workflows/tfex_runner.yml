name: C2C S50 Scheduled Runner

on:
  schedule:
    - cron: "45 4 * * 1-5"   # 11:45 Bangkok
    - cron: "15 7 * * 1-5"   # 14:15 Bangkok
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal run, diagnose = test every data feed"
        type: choice
        default: run
        options: [run, diagnose]

permissions:
  contents: write

concurrency:
  group: c2c-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine_worker.py ${{ inputs.mode == 'diagnose' && '--diagnose' || '' }}
      - name: Persist position state
        run: |
          git config user.name "c2c-bot"
          git config user.email "c2c-bot@users.noreply.github.com"
          git add state/state.json || true
          git diff --cached --quiet || (git commit -m "state: update position" && git push)
