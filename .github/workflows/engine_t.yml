name: C2C Engine T (TFEX Scheduled Scanner)

on:
  schedule:
    # 04:45 UTC = 11:45 AM Bangkok (Morning 2H Session Close)
    - cron: '45 4 * * 1-5'
    # 07:15 UTC = 02:15 PM Bangkok (Afternoon 2H Session Close)
    - cron: '15 7 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from Actions tab

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests yfinance pandas numpy pytz

      - name: Execute TFEX S50 Scan & Generate Tickets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import os
          import requests
          from datetime import datetime
          import pytz
          import yfinance as yf
          import pandas as pd
          import numpy as np

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          bkk_time = datetime.now(pytz.timezone("Asia/Bangkok")).strftime("%Y-%m-%d %H:%M:%S")

          # -------------------------------------------------------------
          # 1. Asian E-mini S&P (ES=F)
          # -------------------------------------------------------------
          es_veto = False
          es_pct = 0.0
          try:
              es_data = yf.download("ES=F", period="5d", interval="1d", progress=False)
              if len(es_data) >= 2:
                  c = es_data["Close"].dropna().values.flatten()
                  if len(c) >= 2:
                      es_pct = float(((c[-1] - c[-2]) / c[-2]) * 100.0)
                      if es_pct <= -0.60:
                          es_veto = True
          except Exception as e:
              print(f"ES=F warning: {e}")

          # -------------------------------------------------------------
          # 2. FX Gate: USD/THB (THB=X)
          # -------------------------------------------------------------
          thb_veto = False
          thb_change_pct = 0.0
          try:
              thb_data = yf.download("THB=X", period="10d", interval="1d", progress=False)
              c_thb = thb_data["Close"].dropna().values.flatten()
              if len(c_thb) >= 5:
                  thb_change_pct = float(((c_thb[-1] - c_thb[-5]) / c_thb[-5]) * 100.0)
                  if thb_change_pct > 0.30:
                      thb_veto = True
          except Exception as e:
              print(f"THB=X warning: {e}")

          # -------------------------------------------------------------
          # 3. Mega-Cap Breadth & DELTA Decoupler
          # -------------------------------------------------------------
          tickers = ["DELTA.BK", "PTT.BK", "PTTEP.BK", "BDMS.BK", "CPALL.BK"]
          advancing = 0
          breadth_details = []
          delta_chg = 0.0

          for t in tickers:
              clean = t.replace(".BK", "")
              try:
                  df = yf.download(t, period="5d", interval="1d", progress=False)
                  c = df["Close"].dropna().values.flatten()
                  if len(c) >= 2:
                      chg = float(((c[-1] - c[-2]) / c[-2]) * 100.0)
                      if clean == "DELTA":
                          delta_chg = chg
                      if chg > 0:
                          advancing += 1
                          breadth_details.append(f"🟢 {clean}: {chg:+.2f}%")
                      elif chg < 0:
                          breadth_details.append(f"🔴 {clean}: {chg:+.2f}%")
                      else:
                          breadth_details.append(f"⚪ {clean}: 0.00%")
                  else:
                      breadth_details.append(f"⚪ {clean}: Flat")
              except Exception:
                  breadth_details.append(f"⚪ {clean}: N/A")

          breadth_pass = (advancing >= 3)
          delta_decoupler_veto = (delta_chg < -1.50)

          # -------------------------------------------------------------
          # 4. SET50 Trend & ATR Proxy
          # -------------------------------------------------------------
          s50_price = 930.0
          s50_ema20 = 925.0
          s50_atr = 4.5
          daily_bullish = True

          try:
              s50_df = yf.download("^SET50", period="3mo", interval="1d", progress=False)
              if len(s50_df) >= 20:
                  c = s50_df["Close"].dropna().values.flatten()
                  h = s50_df["High"].dropna().values.flatten()
                  l = s50_df["Low"].dropna().values.flatten()
                  if len(c) >= 20:
                      s50_price = float(c[-1])
                      s_ema = pd.Series(c).ewm(span=20, adjust=False).mean()
                      s50_ema20 = float(s_ema.iloc[-1])
                      daily_bullish = s50_price >= s50_ema20

                      tr = np.maximum(h[1:] - l[1:], np.abs(h[1:] - c[:-1]))
                      s50_atr = float(pd.Series(tr).rolling(14).mean().iloc[-1])
                      if np.isnan(s50_atr) or s50_atr < 2.0:
                          s50_atr = 4.5
          except Exception as e:
              print(f"^SET50 warning: {e}")

          t1_points = max(4.0, round(1.25 * s50_atr, 1))

          # -------------------------------------------------------------
          # 5. Composite Gates & Telegram Formatting
          # -------------------------------------------------------------
          all_gates_pass = (
              (not es_veto) and 
              (not thb_veto) and 
              breadth_pass and 
              (not delta_decoupler_veto) and 
              daily_bullish
          )

          es_icon = "🔴 VETO" if es_veto else "🟢 PASS"
          thb_icon = "🔴 VETO" if thb_veto else "🟢 PASS"
          breadth_icon = "🟢 PASS" if breadth_pass else "🔴 VETO"
          delta_icon = "🔴 VETO" if delta_decoupler_veto else "🟢 PASS"
          trend_icon = "🟢 BULL" if daily_bullish else "🔴 BEAR"

          lines = [
              "⚡ <b>[C2C Engine T - TFEX S50 Scanner]</b>",
              f"📅 <b>Time:</b> {bkk_time} BKK",
              "━━━━━━━━━━━━━━━━━━",
              f"📈 <b>SET50 Index:</b> {s50_price:.2f} pts [{trend_icon}]",
              f"• 20-day EMA: {s50_ema20:.2f} | 14-ATR: {s50_atr:.1f} pts",
              "━━━━━━━━━━━━━━━━━━",
              "🛡️ <b>INSTITUTIONAL GATE MATRIX:</b>",
              f"• <b>Intermarket (ES=F):</b> {es_pct:+.2f}% [{es_icon}]",
              f"• <b>FX Slope (USD/THB):</b> {thb_change_pct:+.2f}% [{thb_icon}]",
              f"• <b>Mega-Cap Breadth:</b> {advancing}/5 Advancing [{breadth_icon}]",
              f"• <b>DELTA Decoupler:</b> {delta_chg:+.2f}% [{delta_icon}]",
              "  " + " | ".join(breadth_details),
              "━━━━━━━━━━━━━━━━━━"
          ]

          if all_gates_pass:
              entry_ref = s50_price
              stop_ref = entry_ref - 4.5
              t1_ref = entry_ref + t1_points
              t2a_ref = entry_ref + 12.0

              lines.extend([
                  "🎯 <b>REGIME STATUS: GREEN (EXECUTION AUTHORIZED)</b>",
                  "📋 <b>ACTIONABLE SETTRADE STREAMING TICKET:</b>",
                  f"• <b>Position Size:</b> 10 Contracts (฿1.0M Baseline)",
                  f"• <b>Order Type:</b> Long Limit at <b>{entry_ref:.1f}</b>",
                  f"• <b>Hard Stop:</b> <b>{stop_ref:.1f}</b> (-4.5 pts cap)",
                  f"• <b>Tranche 1 (Bank 4 cts):</b> Limit <b>{t1_ref:.1f}</b> (+{t1_points:.1f} pts)",
                  f"  <i>*Ratchet remaining 6 cts to BE ({entry_ref:.1f}) upon fill</i>",
                  f"• <b>Tranche 2A (Fixed 3 cts):</b> Limit <b>{t2a_ref:.1f}</b> (+12.0 pts)",
                  f"• <b>Tranche 2B (Runner 3 cts):</b> Trail High - {s50_atr * 1.5:.1f} pts"
              ])
          else:
              veto_reasons = []
              if es_veto: veto_reasons.append("ES Drop ≤ -0.60%")
              if thb_veto: veto_reasons.append("THB Depreciation > +0.30%")
              if not breadth_pass: veto_reasons.append("Breadth < 3/5")
              if delta_decoupler_veto: veto_reasons.append("DELTA < -1.50%")
              if not daily_bullish: veto_reasons.append("SET50 < EMA(20)")

              lines.extend([
                  "⚠️ <b>REGIME STATUS: FILTER VETO ACTIVE</b>",
                  f"• <b>Vetoed by:</b> {', '.join(veto_reasons) if veto_reasons else 'None'}",
                  "• <b>Action:</b> Stand down. Long execution suppressed."
              ])

          lines.append("━━━━━━━━━━━━━━━━━━\n<i>Automated pipeline running via GitHub Cloud.</i>")
          full_msg = "\n".join(lines)

          # Guaranteed dispatch
          if token and chat_id:
              url = f"https://api.telegram.org/bot{token}/sendMessage"
              res = requests.post(url, json={"chat_id": chat_id, "text": full_msg, "parse_mode": "HTML"}, timeout=15)
              print(f"Telegram status: {res.status_code}")
          else:
              print("Missing Telegram credentials.")
          EOF
