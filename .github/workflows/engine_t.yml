name: Code2Cash v7.7 — Engine T (TFEX S50)

on:
  schedule:
    # Runs every 15 minutes during Thai market hours (03:15–08:45 UTC = 10:15–15:45 BKK)
    - cron: '15,30,45 3 * * 1-5'
    - cron: '0,15,30,45 4 * * 1-5'
    - cron: '15,30,45 7 * * 1-5'
    - cron: '0,15,30 8 * * 1-5'
  workflow_dispatch:
    inputs:
      morning_realized_thb:
        description: 'Morning gross realized P/L in THB (e.g. 3260)'
        required: false
        default: '0'

jobs:
  scan-tfex:
    runs-on: ubuntu-latest
    env:
      ENGINE_VERSION: "Code2Cash v7.7"
      MORNING_REALIZED_THB: ${{ github.event.inputs.morning_realized_thb || '0' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --upgrade pip && pip install pytz requests yfinance pandas
      - name: Run Code2Cash Engine T (v7.7)
        run: python engine_t.py
