name: C2C Engine T (TFEX S50 Scanner)

on:
  schedule:
    - cron: '15 3 * * 1-5'    # 10:15 BKK Morning Session Entry
    - cron: '30 4 * * 1-5'    # 11:30 BKK Midday Audit
    - cron: '15 7 * * 1-5'    # 14:15 BKK Afternoon Session Entry
    - cron: '30 8 * * 1-5'    # 15:30 BKK Close Preparation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine-t:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy requests pytz exchange_calendars

      - name: Execute Engine T
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine_t.py

      - name: Auto-Commit Persistent State
        run: |
          git config --global user.name "C2C State Engine"
          git config --global user.email "bot@code2cash.internal"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: persist engine_t state [skip ci]" && git push)
