name: C2C Engine T (TFEX Multi-Window Scanner)

on:
  schedule:
    # --- Morning Window (10:15 - 12:00 BKK) ---
    - cron: '30 3 * * 1-5'    # 10:30 AM BKK (03:30 UTC)
    - cron: '15 4 * * 1-5'    # 11:15 AM BKK (04:15 UTC)
    - cron: '45 4 * * 1-5'    # 11:45 AM BKK (04:45 UTC)

    # --- Afternoon Window (14:15 - 16:15 BKK) ---
    - cron: '30 7 * * 1-5'    # 02:30 PM BKK (07:30 UTC)
    - cron: '15 8 * * 1-5'    # 03:15 PM BKK (08:15 UTC)
    - cron: '0 9 * * 1-5'     # 04:00 PM BKK (09:00 UTC)

  workflow_dispatch:

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests yfinance pandas numpy pytz exchange_calendars

      - name: Run Engine T Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: python engine_t.py
