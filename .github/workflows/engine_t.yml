name: C2C Engine T (TFEX Scheduled Scanner)

on:
  schedule:
    # 04:45 UTC = 11:45 AM Bangkok (Morning 2H Close)
    - cron: '45 4 * * 1-5'
    # 07:15 UTC = 02:15 PM Bangkok (Afternoon 2H Close)
    - cron: '15 7 * * 1-5'
  workflow_dispatch:

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests yfinance pandas numpy pytz exchange_calendars

      - name: Run Engine T Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: python engine_t.py
        
