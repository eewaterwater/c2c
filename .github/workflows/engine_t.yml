name: C2C Engine T (TFEX S50 Scanner)

on:
  schedule:
    - cron: '35 02 * * 1-5'   # 09:35 BKK - Morning Auction Wick Prep
    - cron: '15 03 * * 1-5'   # 10:15 BKK - Morning Session 15M MSS Trigger
    - cron: '45 06 * * 1-5'   # 13:45 BKK - Afternoon Session Alignment
    - cron: '15 09 * * 1-5'   # 16:15 BKK - Friday Flatten Hook & Daily Audit
  workflow_dispatch:
    inputs:
      action:
        description: 'Manual Trigger Mode (scan, update)'
        required: false
        default: 'scan'

permissions:
  contents: write

jobs:
  scan-tfex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy requests pytz exchange_calendars

      - name: Execute Engine T
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine_t.py

      - name: Auto-Commit Persistent State
        run: |
          git config --global user.name "C2C State Engine"
          git config --global user.email "bot@code2cash.internal"
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: persist engine_t state [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
